name: "Blauberg S21 Ventilation Controller"
description: "Modbus TCP Steuerung und Automation für Blauberg S21 Lüftungsgeräte mit Home Assistant Integration"
version: "0.2.12"
slug: blauberg_s21_ventilation
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
services:
  - mqtt:want
webui: "http://[HOST]:[PORT:8099]"
panel_icon: mdi:fan
panel_title: "S21 Ventilation"
ingress: true
ingress_port: 8099
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Web-Oberfläche (Direktzugriff per IP, optional zusätzlich zu Ingress — Port unter 'Netzwerk' in der Addon-Konfiguration selbst vergeben)"
options:
  s21_ip: "192.168.1.100"
  s21_port: 502
  s21_slave_id: 1
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  ha_token: ""
  log_level: "info"
  web_port: 8099
  poll_interval: 10
schema:
  s21_ip: str
  s21_port: port
  s21_slave_id: int
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: str?
  ha_token: str?
  log_level: list(debug|info|warning|error)?
  web_port: port
  poll_interval: int(1,3600)
